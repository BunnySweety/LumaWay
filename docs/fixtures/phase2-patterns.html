<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LumaWay Phase 2 Patterns</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
    }

    #stage.split-lr {
      background: linear-gradient(90deg, #ff0000 0 50%, #0000ff 50% 100%);
    }

    #stage.split-tb {
      background: linear-gradient(180deg, #ffffff 0 50%, #000000 50% 100%);
    }

    #stage.dark-movie {
      background:
        linear-gradient(180deg, #000 0 14%, transparent 14% 86%, #000 86% 100%),
        radial-gradient(circle at 62% 42%, #583814 0 8%, #101214 18%, #060708 100%);
    }

    #stage.moving-window {
      background: #101010;
    }

    #stage.moving-window::before {
      content: "";
      position: absolute;
      top: 24%;
      left: 8%;
      width: 28%;
      height: 42%;
      background: #ff2700;
      animation: move-window 4s linear infinite alternate;
    }

    #stage.latency-flash {
      background: #000;
      animation: latency-flash 2s steps(1, end) infinite;
    }

    #stage.latency-flash::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 4vw;
      background: #fff;
      animation: latency-marker 2s steps(1, end) infinite;
    }

    #hud {
      position: fixed;
      left: 20px;
      bottom: 18px;
      max-width: min(760px, calc(100vw - 40px));
      padding: 12px 14px;
      background: rgb(0 0 0 / 72%);
      border: 1px solid rgb(255 255 255 / 24%);
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      line-height: 1.35;
    }

    #title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    #keys {
      opacity: 0.78;
    }

    @keyframes move-window {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(220%);
      }
    }

    @keyframes latency-flash {
      0%,
      49.99% {
        background: #000;
      }
      50%,
      100% {
        background: #fff;
      }
    }

    @keyframes latency-marker {
      0%,
      49.99% {
        opacity: 0;
      }
      50%,
      100% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="hud">
    <div id="title"></div>
    <div id="description"></div>
    <div id="keys">Left/Right: pattern · F: fullscreen · H: hide overlay</div>
  </div>
  <script>
    const patterns = [
      { name: "Black", className: "", color: "#000000", description: "True black. Lights should go dark or stay near off." },
      { name: "White", className: "", color: "#ffffff", description: "Full white. All channels should converge to white." },
      { name: "Red", className: "", color: "#ff0000", description: "Full red. All channels should converge to red." },
      { name: "Green", className: "", color: "#00ff00", description: "Full green. All channels should converge to green." },
      { name: "Blue", className: "", color: "#0000ff", description: "Full blue. All channels should converge to blue." },
      { name: "Left red / right blue", className: "split-lr", color: "", description: "Left channels should be red; right channels should be blue." },
      { name: "Top white / bottom black", className: "split-tb", color: "", description: "Top channels should be brighter than bottom channels." },
      { name: "Dark movie frame", className: "dark-movie", color: "", description: "Dim non-black content with letterbox bars. No silent black session." },
      { name: "Moving red window", className: "moving-window", color: "", description: "Red response should move from left to right channels." },
      { name: "Latency flash", className: "latency-flash", color: "", description: "Record screen and lights; measure screen flash to first visible light response." }
    ];

    let index = 0;
    const stage = document.getElementById("stage");
    const title = document.getElementById("title");
    const description = document.getElementById("description");
    const hud = document.getElementById("hud");

    function render() {
      const pattern = patterns[index];
      stage.className = pattern.className;
      stage.style.backgroundColor = pattern.color;
      title.textContent = `${index + 1}/${patterns.length} ${pattern.name}`;
      description.textContent = pattern.description;
    }

    function step(delta) {
      index = (index + delta + patterns.length) % patterns.length;
      render();
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === " ") {
        step(1);
      } else if (event.key === "ArrowLeft") {
        step(-1);
      } else if (event.key.toLowerCase() === "f") {
        document.documentElement.requestFullscreen?.();
      } else if (event.key.toLowerCase() === "h") {
        hud.hidden = !hud.hidden;
      }
    });

    render();
  </script>
</body>
</html>
